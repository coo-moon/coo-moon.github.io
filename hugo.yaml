baseURL: "https://coo-moon.github.io/"
languageCode: "zh-cn"
title: "Wenbo's Blog"
theme: "PaperMod"
pagination:
  pagerSize: 10

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
    style: "catppuccin-mocha"
  goldmark:
    renderer:
      unsafe: true

params:
  author: "Wenbo"
  description: "AI学习笔记 · 技术实践 · 折腾记录"
  defaultTheme: auto
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  comments: true

  homeInfoParams:
    Title: "你好 👋"
    Content: |
      欢迎来到我的博客！  
      我是 Wenbo，正在系统学习 AI，这里记录我的学习笔记、技术实践和各种折腾。  
      
      - <span class="sec-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1.5V4M15 1.5V4M9 20v2.5M15 20v2.5M1.5 9H4M1.5 15H4M20 9h2.5M20 15h2.5"/></svg></span> AI / 大模型 / Agent 开发
      - <span class="sec-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></span> 编程 / 工具 / 效率
      - <span class="sec-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg></span> 学习笔记与思考

  # 首页板块卡片（对应各 section，顺序即展示顺序）
  homeSections: ["ai", "papers", "tech", "database", "invest", "games"]

  # 首页文章列表收录的板块（Hugo 默认只取第一个有内容的 section，必须显式声明）
  mainSections: ["ai", "papers", "tech", "database", "invest", "games"]

  socialIcons:
    - name: github
      url: "https://github.com/coo-moon"
    - name: email
      url: "mailto:comioon@qq.com"
    - name: rss
      url: "/index.xml"

  # 文章封面图占位
  cover:
    linkFullImages: true
    responsiveImages: true

  # SEO
  env: production
  keywords: [AI, 大模型, Agent, Hugo, 博客, 技术笔记]

  # 编辑链接（可选）
  editPost:
    URL: "https://github.com/coo-moon/coo-moon.github.io/tree/main/content"
    Text: "📝 指正本文"  # 显示文字
    appendFilePath: true  # 自动追加文件路径

  # Giscus 评论系统（基于 GitHub Discussions）
  # 配置生成器：https://giscus.app
  giscus:
    repo: "coo-moon/coo-moon.github.io"
    repoID: "R_kgDOTsNaLg"
    category: "Announcements"
    categoryID: "DIC_kwDOTsNaLs4DCkGN"
    theme: "preferred_color_scheme"

  # Umami 访问统计
  # 注册：https://cloud.umami.is
  umami:
    websiteID: "f927a089-5b80-41be-8950-52d1d390dc7b"

menu:
  main:
    - identifier: ai
      name: "AI 学习"
      url: /ai/
      weight: 10
    - identifier: papers
      name: "论文专栏"
      url: /papers/
      weight: 15
    - identifier: tech
      name: "技术实践"
      url: /tech/
      weight: 20
    - identifier: database
      name: "数据库"
      url: /database/
      weight: 25
    - identifier: invest
      name: "投资笔记"
      url: /invest/
      weight: 30
    - identifier: games
      name: "游戏生活"
      url: /games/
      weight: 40
    - identifier: tags
      name: "标签"
      url: /tags/
      weight: 50
    - identifier: archives
      name: "归档"
      url: /archives/
      weight: 60
    - identifier: search
      name: "搜索"
      url: /search/
      weight: 70
    - identifier: about
      name: "关于"
      url: /about/
      weight: 80

outputs:
  home:
    - HTML
    - RSS
    - JSON

# 站点地图
sitemap:
  changefreq: weekly
  priority: 0.5

# 永久链接格式（板块文章仍输出到 /posts/:slug/，保持旧链接不变）
permalinks:
  ai: /posts/:slug/
  papers: /posts/:slug/
  tech: /posts/:slug/
  database: /posts/:slug/
  invest: /posts/:slug/
  games: /posts/:slug/
