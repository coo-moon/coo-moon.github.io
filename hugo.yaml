baseURL: "https://coo-moon.github.io/"
languageCode: "zh-cn"
title: "Wenbo's Blog"
theme: "PaperMod"
pagination:
  pagerSize: 10

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: "dracula"
  goldmark:
    renderer:
      unsafe: true

params:
  author: "Wenbo"
  description: "AI学习笔记 · 技术实践 · 折腾记录"
  defaultTheme: auto
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  comments: true

  homeInfoParams:
    Title: "你好 👋"
    Content: |
      欢迎来到我的博客！  
      我是 Wenbo，正在系统学习 AI，这里记录我的学习笔记、技术实践和各种折腾。  
      
      - 🤖 AI / 大模型 / Agent 开发
      - 💻 编程 / 工具 / 效率
      - 📚 学习笔记与思考

  socialIcons:
    - name: github
      url: "https://github.com/coo-moon"
    - name: email
      url: "mailto:comioon@qq.com"
    - name: rss
      url: "/index.xml"

  # 文章封面图占位
  cover:
    linkFullImages: true
    responsiveImages: true

  # SEO
  env: production
  keywords: [AI, 大模型, Agent, Hugo, 博客, 技术笔记]

  # 编辑链接（可选）
  editPost:
    URL: "https://github.com/coo-moon/coo-moon.github.io/tree/main/content"
    Text: "📝 指正本文"  # 显示文字
    appendFilePath: true  # 自动追加文件路径

  # Giscus 评论系统（基于 GitHub Discussions）
  # 配置生成器：https://giscus.app
  giscus:
    repo: "coo-moon/coo-moon.github.io"
    repoID: "R_kgDOTsNaLg"
    category: "Announcements"
    categoryID: "DIC_kwDOTsNaLs4DCkGN"
    theme: "preferred_color_scheme"

  # Umami 访问统计
  # 注册：https://cloud.umami.is
  umami:
    websiteID: "f927a089-5b80-41be-8950-52d1d390dc7b"

menu:
  main:
    - identifier: posts
      name: 📝 文章
      url: /posts/
      weight: 10
    - identifier: tags
      name: 🏷️ 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 📁 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 🔍 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 👋 关于
      url: /about/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON

# 站点地图
sitemap:
  changefreq: weekly
  priority: 0.5

# 永久链接格式
permalinks:
  posts: /posts/:slug/
