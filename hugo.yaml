baseURL: "https://coo-moon.github.io/"
languageCode: "zh-cn"
title: "Wenbo's Blog"
theme: "PaperMod"
pagination:
  pagerSize: 10

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: "dracula"
  goldmark:
    renderer:
      unsafe: true

params:
  author: "Wenbo"
  description: "AI学习笔记 · 技术实践 · 折腾记录"
  defaultTheme: auto
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowShareButtons: true
  ShowPostNavLinks: true

  homeInfoParams:
    Title: "你好 👋"
    Content: |
      欢迎来到我的博客！  
      我是 Wenbo，正在系统学习 AI，这里记录我的学习笔记、技术实践和各种折腾。  
      
      - 🤖 AI / 大模型 / Agent 开发
      - 💻 编程 / 工具 / 效率
      - 📚 学习笔记与思考

  socialIcons:
    - name: github
      url: "https://github.com/coo-moon"

menu:
  main:
    - identifier: posts
      name: 📝 文章
      url: /posts/
      weight: 10
    - identifier: tags
      name: 🏷️ 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 📁 归档
      url: /archives/
      weight: 30
    - identifier: search
      name: 🔍 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 👋 关于
      url: /about/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON
