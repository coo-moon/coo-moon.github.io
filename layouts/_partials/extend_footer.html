{{- /* Footer custom content area start */ -}}

{{- /* ===== Matrix 数字雨背景（Rezmason/matrix WebGL 版） ===== */ -}}
<iframe id="matrix-rain" src="/matrix/?skipIntro=true&suppressWarnings=true&fallSpeed=1.3&bloomStrength=0.5&brightnessDecay=0.3&resolution=0.75" title="Matrix Rain" loading="eager" frameborder="0" allowfullscreen></iframe>

<script>
(function () {
    // Matrix 数字雨 iframe 背景控制
    const frame = document.getElementById('matrix-rain');
    if (!frame) return;

    // Logo glitch data-text
    const logoLink = document.querySelector('.logo a');
    if (logoLink && !logoLink.dataset.text) {
        logoLink.dataset.text = logoLink.textContent.trim();
    }

    // 滚动时淡出，静止时恢复（减少阅读干扰）
    let scrollTimer = null;
    function onScroll() {
        frame.style.opacity = '0.08';
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
            frame.style.opacity = '0.5';
        }, 400);
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    // 尊重 prefers-reduced-motion
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        frame.style.display = 'none';
        return;
    }

    frame.style.opacity = '0.5';
})();
</script>

{{- /* ===== 首页打字机效果（Typed.js） ===== */ -}}
{{- if .IsHome }}
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
<script>
(function () {
    const el = document.getElementById('matrix-typed');
    if (!el || typeof Typed === 'undefined') return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.textContent = 'Wake up, Neo...';
        return;
    }
    new Typed(el, {
        strings: [
            '> Wake up, Neo...',
            '> The Matrix has you...',
            '> Follow the white rabbit.',
            '> Knock, knock, Neo.'
        ],
        typeSpeed: 55,
        backSpeed: 25,
        backDelay: 1800,
        loop: true,
        showCursor: true,
        cursorChar: '▊'
    });
})();
</script>
{{- end }}

{{- /* Footer custom content area end */ -}}
