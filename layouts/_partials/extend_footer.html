{{- /* ===== Matrix 数字雨 ===== */ -}}
<canvas id="matrix-rain"></canvas>
<script>
(function () {
    // 黑客帝国数字雨
    const canvas = document.getElementById('matrix-rain');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    // 字符集：二进制 + 片假名 + 汉字 + 符号（Matrix 经典字符）
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ<>/{}[]=+*#$%&@!?';

    let fontSize = 14;
    let columns, drops;
    let rafId = null;
    let last = 0;
    const fps = 30;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        fontSize = Math.max(12, Math.min(16, Math.floor(window.innerWidth / 90)));
        columns = Math.floor(canvas.width / fontSize);
        drops = Array(columns).fill(0).map(() => Math.random() * -100);
    }

    function draw(ts) {
        // 帧率限制 ~30fps
        if (ts - last < 1000 / fps) {
            rafId = requestAnimationFrame(draw);
            return;
        }
        last = ts;

        // 半透明黑色覆盖 = 拖尾效果
        ctx.fillStyle = 'rgba(2, 6, 2, 0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = fontSize + 'px "Share Tech Mono", monospace';

        for (let i = 0; i < drops.length; i++) {
            const char = chars[Math.floor(Math.random() * chars.length)];

            // 随机一些字符用亮绿（头部亮）
            const isHead = drops[i] * fontSize > canvas.height * 0.85;
            const alpha = Math.random() > 0.97 ? 0.95 : 0.55;

            if (isHead) {
                ctx.fillStyle = 'rgba(220, 255, 230, 0.95)';
            } else {
                ctx.fillStyle = 'rgba(0, 255, 65, ' + alpha + ')';
            }

            ctx.fillText(char, i * fontSize, drops[i] * fontSize);

            // 随机重置列
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }

        rafId = requestAnimationFrame(draw);
    }

    // 减少对阅读的干扰：数字雨在滚动时淡出，静止时淡入
    let scrollTimer = null;
    function onScroll() {
        canvas.style.opacity = '0.06';
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
            canvas.style.opacity = '0.5';
        }, 300);
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    // 尊重 prefers-reduced-motion
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReduced) {
        canvas.style.display = 'none';
        return;
    }

    resize();
    window.addEventListener('resize', resize);
    canvas.style.opacity = '0.5';
    rafId = requestAnimationFrame(draw);
})();
</script>
<style>
    #matrix-rain { opacity: 0.5; transition: opacity 0.3s ease; }
</style>

{{- /* Footer custom content area end */ -}}
